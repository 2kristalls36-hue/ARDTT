# Put the already-built APK and server packages (full archives plus the
# partial-deploy index, host files, per-layer gzips, Engine and Compose) on
# the existing GitHub Release. Does not rebuild the image or APK.
# PRs never touch Releases.
name: Attach built packages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/attach-built-packages.yml"
      - "scripts/attach-server-packages-to-release.sh"
      - "scripts/rewrite-release-update-json.py"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing APK release tag (empty = v + versionName)
        required: false
        default: ""
      android_run_id:
        description: Successful Android build run id (empty = latest on main)
        required: false
        default: ""
      server_run_id:
        description: Successful Server package run id (empty = latest on main)
        required: false
        default: ""

concurrency:
  group: attach-built-packages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  attach:
    name: Attach APK and server packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve tag and source runs
        id: src
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag || '' }}
          INPUT_ANDROID: ${{ github.event.inputs.android_run_id || '' }}
          INPUT_SERVER: ${{ github.event.inputs.server_run_id || '' }}
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -n 1)"
          test -n "$version_name"
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="v${version_name}"
          fi
          android_id="$INPUT_ANDROID"
          if [ -z "$android_id" ]; then
            # Latest green Android may still be the previous versionName
            # (attach races the new Android build). Prefer a run whose
            # artifact is ardtt-<this version>-*.
            while read -r id; do
              [ -n "$id" ] || continue
              if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/artifacts" \
                    --jq '.artifacts[].name' \
                  | grep -q "^ardtt-${version_name}-"; then
                android_id="$id"
                break
              fi
            done < <(gh run list --workflow 'Android build' --branch main --status success --limit 15 --json databaseId --jq '.[].databaseId')
          fi
          if [ -z "$android_id" ]; then
            android_id="$(gh run list --workflow 'Android build' --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          server_id="$INPUT_SERVER"
          if [ -z "$server_id" ]; then
            server_id="$(gh run list --workflow 'Server package' --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          test -n "$android_id"
          test -n "$server_id"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "android_run=$android_id" >> "$GITHUB_OUTPUT"
          echo "server_run=$server_id" >> "$GITHUB_OUTPUT"
          echo "tag=$tag android=$android_id server=$server_id"

      - name: Download Android artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.src.outputs.android_run }}
          pattern: "ardtt-${{ steps.src.outputs.version_name }}-*"
          merge-multiple: true
          path: apk-dist

      - name: Download server package artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.src.outputs.server_run }}
          pattern: "ardtt-server-*"
          merge-multiple: true
          path: server-dist

      - name: Ensure release exists and APKs are on it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.src.outputs.tag }}
          VERSION_NAME: ${{ steps.src.outputs.version_name }}
        run: bash scripts/ensure-release-apks.sh "$TAG" "$VERSION_NAME" apk-dist

      - name: Attach server packages without clobber
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -lh server-dist/
          bash scripts/attach-server-packages-to-release.sh --tag "${{ steps.src.outputs.tag }}" --from-dir server-dist
