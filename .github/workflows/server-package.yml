# Deploy v2 (docs/adr/0006-deploy-v2.md): build the server image for both
# architectures, save each as one .image.tar.gz and attach them, together with
# the installer, to the GitHub Release of the tag. The VPS downloads exactly one
# of these files; nothing else is published for the server.
name: Server package

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - "scripts/build-server-image.sh"
      - "scripts/pack-server-image.sh"
      - "scripts/publish-server-release.sh"
      - "scripts/check-deploy-bundle.sh"
      - "scripts/test-deploy-v2.sh"
      - ".github/workflows/server-package.yml"
    tags:
      - "v*"
  pull_request:
    paths:
      - "server/**"
      - "scripts/**"
      - "android/app/src/main/assets/deploy/**"
      - "android/app/src/main/java/com/ardtt/app/deploy/**"
      - ".github/workflows/server-package.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: Attach this commit's stack to an existing release tag (empty = build only)
        required: false
        default: ""

concurrency:
  group: server-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  contract:
    name: Installer contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: server/provision/go.sum

      # The runner is a throwaway VM: the Docker scenarios of test-deploy-v2.sh
      # (install, update, rollback, migration, neighbours) may run here.
      - name: Installer contract and Docker scenarios
        shell: bash
        run: |
          sudo -E env ARDTT_TEST_DOCKER=1 PATH="$PATH" bash scripts/check-deploy-bundle.sh

      - name: Provision unit tests
        shell: bash
        run: (cd server/provision && go test ./...)

  package:
    name: Image linux-${{ matrix.arch }}
    needs: contract
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Expose GitHub runtime for BuildKit cache
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Build image
        shell: bash
        env:
          ARDTT_GIT_COMMIT: ${{ github.sha }}
          ARDTT_BUILD_CACHE_FROM: type=gha,scope=server-image-${{ matrix.arch }}
          ARDTT_BUILD_CACHE_TO: type=gha,scope=server-image-${{ matrix.arch }},mode=max
        run: bash scripts/build-server-image.sh "${{ matrix.arch }}"

      - name: Save image
        shell: bash
        run: bash scripts/pack-server-image.sh "${{ matrix.arch }}" dist

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ardtt-server-image-${{ matrix.arch }}
          path: dist/ardtt-server-*-linux-${{ matrix.arch }}.image.tar.gz*
          if-no-files-found: error
          retention-days: 30

  # Same rule as android-build.yml: a push to main with a non-test versionName
  # publishes release v<versionName>, so the images go there too — an APK must
  # never be released without the stack image it installs.
  publish:
    name: Attach to GitHub Release
    needs: package
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag || '' }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            tag="${GITHUB_REF_NAME}"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            name="$(sed -n 's/.*releaseVersionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -n 1)"
            case "$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]')" in
              *test*) tag="" ;;
              *) tag="v${name}" ;;
            esac
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release tag: ${tag:-none (test build)}"

      - name: Download images
        if: steps.tag.outputs.tag != ''
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ardtt-server-image-*
          merge-multiple: true

      - name: Publish
        if: steps.tag.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: bash scripts/publish-server-release.sh --tag "$TAG" --from-dir dist
