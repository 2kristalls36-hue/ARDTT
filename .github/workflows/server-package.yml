# Build and pack self-contained ARDTT server packages (docker save).
# CI may fetch base images and pinned GitHub releases. The VPS payload
# does not: install is docker load + compose --no-build --pull never.
name: Server package

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - "scripts/build-server-image.sh"
      - "scripts/pack-server-package.sh"
      - "scripts/build-server-index.py"
      - "scripts/split-docker-save.py"
      - "scripts/assemble-docker-save.py"
      - "scripts/layer-cache.py"
      - "scripts/verify-server-package.sh"
      - "scripts/verify-server-index.sh"
      - "scripts/attach-server-packages-to-release.sh"
      - "scripts/check-deploy-bundle.sh"
      - "scripts/safe-extract-package.py"
      - ".github/workflows/server-package.yml"
    tags:
      - "v*"
  pull_request:
    paths:
      - "server/**"
      - "scripts/**"
      - "android/app/src/main/java/com/ardtt/app/deploy/**"
      - ".github/workflows/server-package.yml"
  workflow_dispatch:

concurrency:
  group: server-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  contract:
    name: Installer contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: server/provision/go.sum

      - name: Contract tests (no Docker image build)
        shell: bash
        run: |
          bash scripts/check-deploy-bundle.sh
          bash scripts/test-install-disk-guard.sh
          bash scripts/test-install-buildkit-wipe.sh
          bash scripts/test-verify-loaded-image.sh
          bash scripts/test-instance-metadata-rollback.sh
          bash scripts/test-install-live-isolation-guard.sh
          (cd server/provision && go test ./...)

  pr-artifacts:
    name: PR host-file artifacts
    needs: contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Pack installer host files (no image)
        shell: bash
        run: |
          set -euo pipefail
          ver="$(tr -d '[:space:]' < server/DEPLOY_VERSION)"
          mkdir -p dist
          tar -C server -czf "dist/ardtt-server-hostfiles-${ver}.tar.gz" \
            install.sh fetch-and-install.sh install-lib ready.sh docker-compose.yml docker-compose.exit.yml \
            DEPLOY_VERSION manifest.json 2>/dev/null || \
          tar -C server -czf "dist/ardtt-server-hostfiles-${ver}.tar.gz" \
            install.sh fetch-and-install.sh install-lib ready.sh docker-compose.yml docker-compose.exit.yml \
            DEPLOY_VERSION
          sha256sum "dist/ardtt-server-hostfiles-${ver}.tar.gz" \
            | awk '{print $1}' > "dist/ardtt-server-hostfiles-${ver}.tar.gz.sha256"
          ls -lh dist/

      - name: Upload host-file artifact
        uses: actions/upload-artifact@v4
        with:
          name: ardtt-server-hostfiles
          path: dist/ardtt-server-hostfiles-*.tar.gz*
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package linux-${{ matrix.arch }}
    needs: contract
    if: github.event_name != 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Exposes ACTIONS_RUNTIME_TOKEN / ACTIONS_CACHE_URL to `docker buildx build`
      # so type=gha cache works from a plain run step.
      - name: Expose GitHub runtime for BuildKit cache
        uses: crazy-max/ghaction-github-runtime@v4

      # Persistent BuildKit cache: unchanged Dockerfile steps yield byte-identical
      # layers across builds, so a VPS on partial deploy downloads only layers
      # whose inputs really changed.
      - name: Build image
        shell: bash
        env:
          ARDTT_GIT_COMMIT: ${{ github.sha }}
          ARDTT_BUILD_CACHE_FROM: type=gha,scope=server-image-${{ matrix.arch }}
          ARDTT_BUILD_CACHE_TO: type=gha,scope=server-image-${{ matrix.arch }},mode=max
        run: bash scripts/build-server-image.sh "${{ matrix.arch }}"

      - name: Pack release archive and partial-deploy assets
        shell: bash
        env:
          ARDTT_PACKAGE_ARCH: ${{ matrix.arch }}
          ARDTT_GIT_COMMIT: ${{ github.sha }}
          ARDTT_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          bash scripts/pack-server-package.sh
          ls -lh dist/

      - name: Load package without pull
        shell: bash
        run: |
          ver="$(tr -d '[:space:]' < server/DEPLOY_VERSION)"
          pkg="dist/ardtt-server-${ver}-linux-${{ matrix.arch }}.tar.gz"
          bash scripts/verify-server-package.sh "$pkg"
          bash scripts/verify-server-index.sh "dist/ardtt-server-${ver}-linux-${{ matrix.arch }}.index.json"

      # Upload before live isolation: install.sh used to delete ARDTT_PACKAGE
      # (the dist tarball) after extract, so amd64 artifacts were only .sha256.
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ardtt-server-${{ matrix.arch }}
          path: |
            dist/ardtt-server-*-linux-${{ matrix.arch }}.tar.gz
            dist/ardtt-server-*-linux-${{ matrix.arch }}.tar.gz.sha256
            dist/ardtt-server-*-linux-${{ matrix.arch }}.index.json
            dist/ardtt-server-*-linux-${{ matrix.arch }}.index.json.sha256
            dist/ardtt-server-*-linux-${{ matrix.arch }}-hostfiles.tar.gz
            dist/ardtt-server-*-linux-${{ matrix.arch }}-layer-*.tar.gz
            dist/ardtt-docker-engine-*-linux-${{ matrix.arch }}.tgz
            dist/ardtt-docker-compose-*-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 30

      - name: Require packed tarball in artifact paths
        shell: bash
        run: |
          set -euo pipefail
          ver="$(tr -d '[:space:]' < server/DEPLOY_VERSION)"
          pkg="dist/ardtt-server-${ver}-linux-${{ matrix.arch }}.tar.gz"
          test -f "$pkg"
          test -s "$pkg"
          sz="$(stat -c%s "$pkg")"
          # Real packages are hundreds of MB; refuse empty/sha-only leftovers.
          test "$sz" -gt 1048576
          echo "package bytes=$sz"

      - name: Live isolation without touching foreign containers
        if: matrix.arch == 'amd64'
        shell: bash
        env:
          ARDTT_REQUIRE_READY: "0"
        run: |
          ver="$(tr -d '[:space:]' < server/DEPLOY_VERSION)"
          # Copy so a buggy installer cannot erase the uploaded source path.
          src="dist/ardtt-server-${ver}-linux-${{ matrix.arch }}.tar.gz"
          cp -f "$src" "${src}.live"
          cp -f "${src}.sha256" "${src}.live.sha256"
          bash scripts/test-install-live-isolation.sh "${src}.live"

  publish:
    name: Attach packages to GitHub Release
    needs: [contract, package]
    # Only an explicit version tag publishes. PRs never touch Releases.
    # Main does not clobber an existing tag. No mixing of a new installer
    # with an older image under the same package version.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish this tag without clobber
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/attach-server-packages-to-release.sh --tag "${GITHUB_REF_NAME}" --from-dir dist
