# Signed APK on main / tag / manual run.
# versionName contains "test" → artifacts only (Actions → Artifacts).
# Otherwise → GitHub Release (stable). workflow_dispatch can override.
name: Android build

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "scripts/build-bypass-client.sh"
      - "scripts/build-release-apk.sh"
      - "scripts/pack-stack.sh"
      - "scripts/pack-deploy-assets.sh"
      - "server/**"
      - ".github/workflows/android-build.yml"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub Release (auto = only if versionName has no "test")
        type: choice
        options:
          - auto
          - always
          - never
        default: auto

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read app version
        id: version
        shell: bash
        run: |
          version_name="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -n 1)"
          version_code="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' android/app/build.gradle.kts | head -n 1)"
          test -n "$version_name"
          test -n "$version_code"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v${version_name}"
          fi
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Decide publish channel
        id: channel
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          PUBLISH_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release || 'auto' }}
        run: |
          version_lc="$(printf '%s' "$VERSION_NAME" | tr '[:upper:]' '[:lower:]')"
          is_test=false
          case "$version_lc" in
            *test*) is_test=true ;;
          esac
          publish=false
          case "$PUBLISH_MODE" in
            always) publish=true ;;
            never) publish=false ;;
            *)
              if [[ "$is_test" == false ]]; then
                publish=true
              fi
              ;;
          esac
          echo "is_test=$is_test" >> "$GITHUB_OUTPUT"
          echo "publish_release=$publish" >> "$GITHUB_OUTPUT"
          if [[ "$publish" == true ]]; then
            echo "channel=release" >> "$GITHUB_OUTPUT"
          else
            echo "channel=artifact" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION_NAME mode=$PUBLISH_MODE is_test=$is_test publish=$publish"

      - name: Validate release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "${{ steps.version.outputs.version_name }}" = "$version"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: android/go_client/go.sum

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: Prepare signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/keystore/ardtt-release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=keystore/ardtt-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APKs
        shell: bash
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
        run: |
          bash scripts/build-bypass-client.sh
          cd android
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          ./gradlew :app:assembleRelease -PtargetAbis=arm64-v8a,armeabi-v7a,x86_64 --no-daemon

      - name: Package build assets
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          mkdir -p dist
          bash scripts/pack-stack.sh
          found=0
          for apk in android/app/build/outputs/apk/release/*.apk; do
            test -f "$apk" || continue
            "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$apk"
            base="$(basename "$apk")"
            arch="${base#app-}"
            arch="${arch%-release.apk}"
            cp "$apk" "dist/ardtt-${VERSION_NAME}-${arch}.apk"
            found=1
          done
          test "$found" = 1
          export SHA256="$(sha256sum "dist/ardtt-${VERSION_NAME}-arm64-v8a.apk" | awk '{print $1}')"
          export SIZE_BYTES="$(stat -c%s "dist/ardtt-${VERSION_NAME}-arm64-v8a.apk")"
          export NOTES="$(git log -1 --pretty=format:%s)"
          python3 - <<'PY'
          import json, os, pathlib
          version_name = os.environ["VERSION_NAME"]
          version_code = int(os.environ["VERSION_CODE"])
          release_tag = os.environ["RELEASE_TAG"]
          sha256 = os.environ["SHA256"]
          size_bytes = int(os.environ["SIZE_BYTES"])
          repo = os.environ["GITHUB_REPOSITORY"]
          pathlib.Path("dist/ardtt-update.json").write_text(
              json.dumps(
                  {
                      "versionCode": version_code,
                      "versionName": version_name,
                      "apkUrl": f"https://github.com/{repo}/releases/download/{release_tag}/ardtt-{version_name}-arm64-v8a.apk",
                      "sha256": sha256,
                      "sizeBytes": size_bytes,
                      "notes": os.environ.get("NOTES", ""),
                  },
                  ensure_ascii=False,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          (cd dist && sha256sum ./*.apk ./*.json > SHA256SUMS.txt)

      - name: Upload Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ardtt-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.short_sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: steps.channel.outputs.publish_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.release_tag }}"
          version_name="${{ steps.version.outputs.version_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            args=(--title "ARDTT ${tag}" --generate-notes --latest)
            case "$tag" in
              *-alpha*|*-beta*|*-rc*|*-verify*|*-github*) args+=(--prerelease) ;;
            esac
            gh release create "$tag" dist/* --target "$GITHUB_SHA" "${args[@]}"
          fi
          echo "Published https://github.com/${{ github.repository }}/releases/tag/${tag}"

      # Server packages attach from server-package.yml on an explicit git tag
      # (--from-dir after that workflow's own artifacts). Do not call the
      # attach script here: it no longer fetches Actions artifacts.

      - name: Write job summary
        if: always()
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
          PUBLISH: ${{ steps.channel.outputs.publish_release }}
          IS_TEST: ${{ steps.channel.outputs.is_test }}
          TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          {
            echo "## Android build"
            echo
            echo "- versionName: \`$VERSION_NAME\`"
            echo "- test in version: \`$IS_TEST\`"
            echo "- GitHub Release: \`$PUBLISH\` (channel \`$CHANNEL\`)"
            if [[ "$PUBLISH" == true ]]; then
              echo "- release: https://github.com/${{ github.repository }}/releases/tag/${TAG}"
            else
              echo "- APK is on this run's **Artifacts** tab (not Releases). Retention 30 days."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
