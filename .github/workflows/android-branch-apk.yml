# Preview APK for a branch / PR. Always an Actions artifact — never a GitHub Release.
name: Preview APK

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: preview-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Build arm64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        shell: bash
        run: |
          version_name="0.5.267-pr237-preview"
          version_code="288"
          test -n "$version_name"
          test -n "$version_code"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: android/go_client/go.sum

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Google removed the obsolete `tools` package; the action default
          # (`tools platform-tools`) now fails sdkmanager on a fresh runner.
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Prepare signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/keystore/ardtt-release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=keystore/ardtt-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Android unit tests
        shell: bash
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          cd android
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Go client tests
        shell: bash
        run: |
          cd android/go_client
          go test ./...
          go test -race ./...

      - name: RAW server tests
        shell: bash
        run: |
          cd server/bypass/wdtt-server
          go test ./server/
          go test -race ./server/

      - name: Build arm64-v8a release APK
        shell: bash
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
        run: |
          bash scripts/pack-hostfiles-overlay.sh
          bash scripts/build-bypass-client.sh arm64-v8a
          cd android
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          ./gradlew :app:assembleRelease \
            -PtargetAbis=arm64-v8a \
            -PpreviewVersionCode=288 \
            -PpreviewVersionName=0.5.267-pr237-preview \
            --no-daemon

      - name: Verify signed APK
        shell: bash
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          apk="android/app/build/outputs/apk/release/app-arm64-v8a-release.apk"
          test -f "$apk"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          tmp="$(mktemp -d)"
          unzip -qo "$apk" "lib/arm64-v8a/*.so" -d "$tmp"
          mapfile -d '' arm64_libs < <(find "$tmp/lib/arm64-v8a" -type f -name '*.so' -print0 | sort -z)
          if (( ${#arm64_libs[@]} == 0 )); then
            echo "No arm64-v8a native libraries found in $apk" >&2
            exit 1
          fi
          python3 scripts/check-elf-16k.py "${arm64_libs[@]}"
          mkdir -p dist
          out="dist/ardtt-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.short_sha }}-arm64-v8a.apk"
          cp "$apk" "$out"
          {
            echo "Preview version: \`${{ steps.version.outputs.version_name }}\` (versionCode \`${{ steps.version.outputs.version_code }}\`)."
            echo "GitHub wraps this in a ZIP. Unzip it, then install the \`.apk\` (~22 MB)."
            echo "Do not install the \`.zip\` itself — that shows «пакет недействителен»."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ardtt-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.short_sha }}-arm64-v8a
          path: dist/ardtt-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.short_sha }}-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14
