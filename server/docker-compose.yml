# nonameVPN server stack
# Usage:
#   export NVPN_PUBLIC_HOST=1.2.3.4
#   docker compose -f server/docker-compose.yml up -d --build
#
# Notes:
# - host network + NET_ADMIN required for TUN (direct/bypass/warp).
# - provision exposes TCP :9100 /health and generates AWG keypairs.
# - direct: amneziawg-go + awg (AmneziaWG 2.0 userspace).
# - bypass: wdtt-server -listen-raw (WDTT, GPL-3).
# - dns: dnsmasq on 10.8.0.1 / 10.9.0.1 (client DNS; upstream 1.1.1.1 via main).
# - warp: hideIp → table 51820; DNS :53 stays on main (or hits local dnsmasq).

services:
  provision:
    build: ./provision
    container_name: nvpn-provision
    network_mode: host
    environment:
      NVPN_PUBLIC_HOST: ${NVPN_PUBLIC_HOST:-}
      NVPN_PROVISION_LISTEN: ${NVPN_PROVISION_LISTEN:-0.0.0.0:9100}
      NVPN_DATA: /data
    volumes:
      - ./data:/data
    restart: unless-stopped

  direct:
    build: ./direct
    container_name: nvpn-direct
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      NVPN_DIRECT_PORT: ${NVPN_DIRECT_PORT:-51820}
      NVPN_DATA: /data
    volumes:
      - ./data:/data:ro
    depends_on:
      - provision
    restart: unless-stopped

  bypass:
    build: ./bypass
    container_name: nvpn-bypass
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      NVPN_BYPASS_PORT: ${NVPN_BYPASS_PORT:-56003}
      NVPN_DATA: /data
      NVPN_BYPASS_DNS: ${NVPN_BYPASS_DNS:-10.9.0.1}
    volumes:
      - ./data:/data:ro
      - bypass-config:/etc/wdtt
    depends_on:
      - provision
    restart: unless-stopped

  dns:
    build: ./dns
    container_name: nvpn-dns
    network_mode: host
    depends_on:
      - direct
      - bypass
    restart: unless-stopped

  warp:
    build: ./warp
    container_name: nvpn-warp
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      GOMEMLIMIT: ${NVPN_WARP_GOMEMLIMIT:-400MiB}
      NVPN_DATA: /data
      NVPN_WARP_STATE: /var/lib/nvpn-warp
    volumes:
      - ./data:/data:ro
      - ./data/warp:/var/lib/nvpn-warp
    depends_on:
      - provision
      - dns
    restart: unless-stopped

volumes:
  bypass-config:
