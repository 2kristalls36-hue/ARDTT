# ARDTT unified container
# Usage:
#   export ARDTT_PUBLIC_HOST=1.2.3.4
#   docker compose --profile isolated up -d --build
#
# Default profile `isolated`: own netns, published ports only.
# iptables / TUN / ip rules stay inside the container — other VPS services keep
# their host network. Last-resort host netns: COMPOSE_PROFILES=hostnet
# (or ARDTT_NETWORK_MODE=hostnet).

x-ardtt: &ardtt
  build: .
  image: ${COMPOSE_PROJECT_NAME:-stack}-ardtt
  container_name: ardtt
  restart: unless-stopped
  init: true
  cap_add:
    - NET_ADMIN
    - NET_RAW
  devices:
    - /dev/net/tun:/dev/net/tun
  volumes:
    - ./data:/data
    - ${ARDTT_TELEMETRY_LOG_ROOT:-/var/logs/app}:/var/logs/app
  environment:
    ARDTT_PUBLIC_HOST: ${ARDTT_PUBLIC_HOST:-}
    ARDTT_PROVISION_LISTEN: ${ARDTT_PROVISION_LISTEN:-0.0.0.0:9100}
    ARDTT_DATA: /data
    ARDTT_DEPLOY_VERSION: ${ARDTT_DEPLOY_VERSION:-}
    ARDTT_ROLE: ${ARDTT_ROLE:-entry}
    ARDTT_CASCADE_ENABLED: ${ARDTT_CASCADE_ENABLED:-0}
    ARDTT_CASCADE_DNS: ${ARDTT_CASCADE_DNS:-}
    ARDTT_CASCADE_PEER_ENDPOINT: ${ARDTT_CASCADE_PEER_ENDPOINT:-}
    ARDTT_CASCADE_PEER_PUBLIC_KEY: ${ARDTT_CASCADE_PEER_PUBLIC_KEY:-}
    ARDTT_CASCADE_LISTEN_PORT: ${ARDTT_CASCADE_LISTEN_PORT:-51820}
    ARDTT_DIRECT_PORT: ${ARDTT_DIRECT_PORT:-51820}
    ARDTT_BYPASS_PORT: ${ARDTT_BYPASS_PORT:-56003}
    ARDTT_BYPASS_DNS: ${ARDTT_BYPASS_DNS:-10.9.0.1}
    ARDTT_WDTT_CONFIG: /data/wdtt
    GOMEMLIMIT: ${ARDTT_WARP_GOMEMLIMIT:-256MiB}
    ARDTT_WARP_STATE: /var/lib/ardtt-warp
    ARDTT_WARP_MODE: ${ARDTT_WARP_MODE:-hideip}
    ARDTT_WARP_DNS_IIFACES: ${ARDTT_WARP_DNS_IIFACES:-awg0 wdttraw0}
    ARDTT_WARP_HIDEIP_URL: ${ARDTT_WARP_HIDEIP_URL:-}
    TELEMETRY_LOG_ROOT: /var/logs/app
    TELEMETRY_LISTEN: ${TELEMETRY_LISTEN:-0.0.0.0:9200}
    TELEMETRY_REVIEW_TOKEN: ${TELEMETRY_REVIEW_TOKEN:-}
    ARDTT_SKIP_TELEMETRY: ${ARDTT_SKIP_TELEMETRY:-0}
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  ardtt:
    <<: *ardtt
    profiles: ["isolated"]
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    ports:
      - "${ARDTT_DIRECT_PORT:-51820}:${ARDTT_DIRECT_PORT:-51820}/udp"
      - "${ARDTT_BYPASS_PORT:-56003}:${ARDTT_BYPASS_PORT:-56003}/udp"
      - "${ARDTT_PROVISION_PORT:-9100}:9100/tcp"
      - "${ARDTT_TELEMETRY_PORT:-9200}:9200/tcp"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9100/health"]
      interval: 15s
      timeout: 4s
      retries: 8
      start_period: 20s

  # Host netns — only when isolated UDP publish is broken on that VPS.
  ardtt-host:
    <<: *ardtt
    profiles: ["hostnet"]
    network_mode: host
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9100/health"]
      interval: 15s
      timeout: 4s
      retries: 8
      start_period: 20s
