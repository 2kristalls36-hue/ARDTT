# Production Compose for a preloaded ARDTT image (docker load).
# There is no build: and pull is forbidden. Hostnet is not a supported mode.
#
# Host published ports (ARDTT_*_PORT) map to stable container listen ports:
#   Direct UDP  -> 51820
#   Bypass UDP  -> 56003
#   cascade UDP -> 51820 (exit uses Direct publish for this)
#   provision   -> 9100/tcp
#   telemetry   -> 9200/tcp
#
# Capabilities: cap_drop ALL, then NET_ADMIN (TUN, iptables, ip rule in this
# netns), NET_RAW (RAW Bypass), and SETUID/SETGID so dnsmasq can drop to
# its configured user/group. setgid(dip) fails with Operation not permitted
# when those caps are missing. No host PID/IPC and no engine socket mount.

x-ardtt-labels: &ardtt-labels
  com.ardtt.owner: ardtt
  com.ardtt.instance: ${ARDTT_INSTANCE_ID}
  com.ardtt.role: ${ARDTT_ROLE:-entry}
  com.ardtt.deploy-version: ${ARDTT_DEPLOY_VERSION:-}

services:
  ardtt:
    image: ${ARDTT_IMAGE}
    pull_policy: never
    container_name: ${ARDTT_CONTAINER_NAME}
    hostname: ardtt
    restart: unless-stopped
    init: true
    labels:
      <<: *ardtt-labels
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/net/tun:/dev/net/tun
    mem_limit: ${ARDTT_MEM_LIMIT:-1g}
    cpus: ${ARDTT_CPUS:-2.0}
    pids_limit: ${ARDTT_PIDS_LIMIT:-512}
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - ${ARDTT_DATA_DIR}:/data
      - ${ARDTT_LOG_DIR}:/var/logs/app
    environment:
      ARDTT_PUBLIC_HOST: ${ARDTT_PUBLIC_HOST:-}
      ARDTT_PROVISION_LISTEN: 0.0.0.0:9100
      ARDTT_PROVISION_PORT: ${ARDTT_PROVISION_PORT:-9100}
      ARDTT_DATA: /data
      ARDTT_DEPLOY_VERSION: ${ARDTT_DEPLOY_VERSION:-}
      ARDTT_ROLE: ${ARDTT_ROLE:-entry}
      ARDTT_CASCADE_ROLE: ${ARDTT_ROLE:-entry}
      ARDTT_CASCADE_ENABLED: ${ARDTT_CASCADE_ENABLED:-0}
      ARDTT_CASCADE_DNS: ${ARDTT_CASCADE_DNS:-}
      ARDTT_CASCADE_PEER_ENDPOINT: ${ARDTT_CASCADE_PEER_ENDPOINT:-}
      ARDTT_CASCADE_PEER_PUBLIC_KEY: ${ARDTT_CASCADE_PEER_PUBLIC_KEY:-}
      ARDTT_CASCADE_PEER_PROVISION_PORT: ${ARDTT_CASCADE_PEER_PROVISION_PORT:-9100}
      ARDTT_CASCADE_LISTEN_PORT: ${ARDTT_DIRECT_LISTEN_PORT:-51820}
      ARDTT_DIRECT_PORT: ${ARDTT_DIRECT_PORT:-51820}
      ARDTT_DIRECT_LISTEN_PORT: ${ARDTT_DIRECT_LISTEN_PORT:-51820}
      ARDTT_BYPASS_PORT: ${ARDTT_BYPASS_PORT:-56003}
      ARDTT_BYPASS_LISTEN_PORT: ${ARDTT_BYPASS_LISTEN_PORT:-56003}
      ARDTT_BYPASS_DNS: ${ARDTT_BYPASS_DNS:-10.9.0.1}
      ARDTT_WDTT_CONFIG: /data/wdtt
      GOMEMLIMIT: ${ARDTT_WARP_GOMEMLIMIT:-256MiB}
      ARDTT_WARP_STATE: /data/warp
      ARDTT_WARP_MODE: ${ARDTT_WARP_MODE:-hideip}
      ARDTT_WARP_DNS_IIFACES: ${ARDTT_WARP_DNS_IIFACES:-awg0 wdttraw0}
      ARDTT_WARP_HIDEIP_URL: ${ARDTT_WARP_HIDEIP_URL:-}
      TELEMETRY_LOG_ROOT: /var/logs/app
      TELEMETRY_LISTEN: 0.0.0.0:9200
      ARDTT_TELEMETRY_PORT: ${ARDTT_TELEMETRY_PORT:-9200}
      TELEMETRY_REVIEW_TOKEN: ${TELEMETRY_REVIEW_TOKEN:-}
      ARDTT_SKIP_TELEMETRY: ${ARDTT_SKIP_TELEMETRY:-0}
      ARDTT_NETWORK_MODE: isolated
    ports:
      - "${ARDTT_DIRECT_PORT:-51820}:${ARDTT_DIRECT_LISTEN_PORT:-51820}/udp"
      - "${ARDTT_BYPASS_PORT:-56003}:${ARDTT_BYPASS_LISTEN_PORT:-56003}/udp"
      - "${ARDTT_PROVISION_PORT:-9100}:9100/tcp"
      - "${ARDTT_TELEMETRY_PORT:-9200}:9200/tcp"
    networks:
      ardtt:
    healthcheck:
      test: ["CMD", "bash", "/opt/ardtt/ready.sh"]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ardtt:
    name: ${ARDTT_NETWORK_NAME}
    labels:
      <<: *ardtt-labels
    ipam:
      config:
        - subnet: ${ARDTT_BRIDGE_SUBNET}
